<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Strixora">
  <title>Strixora</title>
  <!-- App-icon tile. Flat near-black, no gradients, glows or filters:
       renders identically at every size. -->
  <rect width="512" height="512" rx="112" fill="#0D0E12"/>

  <!-- Owl head. The ear tufts are broad and short, and their base is a chord of
       the crown circle, so they grow out of the head as one solid silhouette
       instead of pinching off like cat ears. -->
  <g fill="#8B5CF6">
    <path d="M230 124 L145 172 L166 104 Z"/>
    <path d="M282 124 L367 172 L346 104 Z"/>
    <path d="M106 272 A150 150 0 0 1 406 272 C406 344 348 404 256 428 C164 404 106 344 106 272 Z"/>
  </g>

  <!-- Facial discs: large and tightly spaced as on a real owl, maximum
       contrast so the mark still reads at 32px. -->
  <g fill="#F2F4F8">
    <circle cx="188" cy="276" r="54"/>
    <circle cx="324" cy="276" r="54"/>
  </g>

  <!-- Pupils punch through to the tile colour: a steady, watchful gaze. -->
  <g fill="#0D0E12">
    <circle cx="188" cy="276" r="17"/>
    <circle cx="324" cy="276" r="17"/>
  </g>

  <!-- Beak, seated in the gap between the facial discs. -->
  <path d="M256 358 L238 316 L274 316 Z" fill="#F2F4F8"/>
</svg>
